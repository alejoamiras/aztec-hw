# Surface ledger-app to ragger from the monorepo root.
# Ragger walks up from the pytest dir to the first `.git` directory and looks
# for `ledger_app.toml` there — we keep this file thin and point at the real
# source under `ledger-app/`.

[app]
# Ragger's `find_application` appends `build/<device>/bin/app.elf` to this.
# Our app lives under `ledger-app/`, so this points at the subdir; ragger then
# resolves to `<repo-root>/ledger-app/build/<device>/bin/app.elf` ✓.
build_directory = "ledger-app"
sdk = "C"
devices = ["nanox", "nanos+", "stax", "flex"]
