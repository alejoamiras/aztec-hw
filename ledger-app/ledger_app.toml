[app]
# Standard `Makefile.standard_app` lays artefacts at `build/<device>/bin/app.elf`.
# Ragger reads the top-level `../ledger_app.toml` for the matrix lookup;
# this copy stays present for `ledger-app/` to remain a self-describing Ledger
# project (per Ledger app submission conventions).
build_directory = "./"
sdk = "C"
devices = ["nanox", "nanos+", "stax", "flex"]

# Compilation use_cases (development-only; production builds don't use these).
[use_cases]
debug = "DEBUG=1"
