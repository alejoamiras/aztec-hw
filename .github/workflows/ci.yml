name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Biome lint + format check
        run: bun run lint

      - name: Clear-signing v0 manifest cross-check (fail-closed on aztec-standards drift)
        run: bun run --cwd packages/adapter-ledger gen:clear-signing-v0:check

      - name: Typecheck all packages
        run: bunx tsc -b --noEmit packages/core packages/adapter-trezor packages/adapter-ledger apps/demo

      - name: Tests
        run: bun test

      - name: bun audit
        run: bun audit
        continue-on-error: true

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
